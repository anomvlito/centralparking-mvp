name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/services/centralparking/deploy/backend
            sudo -u fabian -H git -C /opt/services/centralparking/deploy/backend \
              pull --ff-only origin main
            /opt/services/centralparking/centralparking-mvp/.venv/bin/python \
              -m pip install -r requirements.txt --quiet
            sudo systemctl restart centralparking
            sudo systemctl restart parking-watchdog
            sleep 3
            systemctl is-active --quiet centralparking && echo "✓ centralparking OK" || { echo "✗ servicio no levantó"; exit 1; }
            systemctl is-active --quiet parking-watchdog && echo "✓ parking-watchdog OK" || { echo "✗ watchdog no levantó"; exit 1; }
